{% extends 'base.html' %}
{% block content %}
<h2>My Availability</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}
<button class="btn btn-primary">Add Slot</button></form>

<h4 class="mt-3">Existing Slots</h4>
<ul class="list-group">
{% for s in slots %}
<li class="list-group-item d-flex justify-content-between">
    {{ s.get_day_of_week_display }}: {{ s.start_time }} - {{ s.end_time }}
    <a href="{% url 'appointments:delete_availability' s.id %}" class="btn btn-sm btn-danger">Delete</a>
</li>
{% endfor %}
</ul>
{% endblock %}
