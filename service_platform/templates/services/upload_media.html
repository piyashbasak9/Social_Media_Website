{% extends 'base.html' %}
{% block content %}
<h3>Upload Media for "{{ service.title }}"</h3>
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}
<button class="btn btn-primary">Upload</button></form>

<h5 class="mt-3">Existing media</h5>
{% for m in media_list %}
    <div>{{ m.media_type }} - <a href="{{ m.file.url }}">{{ m.file.name }}</a></div>
{% endfor %}
{% endblock %}
