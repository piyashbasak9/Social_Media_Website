{% extends 'base.html' %}
{% block content %}
<div class="panel-card p-4 mb-4">
    <h2 class="mb-3">Staff Users</h2>
    <form method="get" class="row g-2">
        <div class="col-sm">
            <label for="staff-search" class="visually-hidden">Search by name or user ID</label>
            <input id="staff-search" type="search" name="q" value="{{ query }}" class="form-control" placeholder="Search by name or user ID">
        </div>
        <div class="col-sm-auto">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
</div>

<div class="table-responsive">
    <table class="table align-middle">
        <thead>
            <tr><th scope="col">User ID</th><th scope="col">Name</th><th scope="col">Profile</th></tr>
        </thead>
        <tbody>
            {% for staff_user in staff_users %}
                <tr>
                    <td>{{ staff_user.id }}</td>
                    <td>{{ staff_user.full_name }}</td>
                    <td><a href="{% url 'profiles:staff_profile' staff_user.id %}" class="btn btn-outline-primary btn-sm">View profile</a></td>
                </tr>
            {% empty %}
                <tr><td colspan="3" class="text-muted">No staff users found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
