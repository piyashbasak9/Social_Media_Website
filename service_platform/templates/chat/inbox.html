{% extends 'base.html' %}
{% block content %}
<div class="panel-card p-4 mb-4">
	<h2 class="mb-1">Messages</h2>
	<p class="text-muted mb-0">Your conversations with staff</p>
</div>
<div class="list-group inbox-list">
{% for p in partners %}
	<a href="{% url 'chat:conversation' p.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center gap-3">
		<span class="{% if p.unread_count %}fw-bold text-body{% else %}text-body{% endif %}">{{ p.full_name }}</span>
		{% if p.unread_count %}<span class="badge text-bg-primary">{{ p.unread_count }} unread</span>{% endif %}
	</a>
{% empty %}
	<div class="list-group-item text-muted">No conversations yet.</div>
{% endfor %}
</div>
{% endblock %}
