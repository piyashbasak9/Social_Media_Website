{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="form-card">
            <h2 class="mb-3">Welcome back</h2>
            <p class="text-muted">Login to continue your journey.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <div class="d-flex justify-content-between mt-3 small">
                <a href="{% url 'accounts:password_reset_request' %}" class="text-decoration-none">Forgot password?</a>
                <a href="{% url 'accounts:register' %}" class="text-decoration-none">Create account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
