{% extends 'base.html' %}
{% block content %}
<h2>Verify Email</h2>
<p>We sent a code to <strong>{{ email }}</strong>.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Verify</button>
</form>
<a href="{% url 'accounts:resend_verification' %}" class="btn btn-link">Resend code</a>
{% endblock %}
